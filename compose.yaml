name: hackethon-itb-estafet

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-estafet}
      POSTGRES_USER: ${POSTGRES_USER:-estafet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estafet_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
    name: hackethon-itb_postgres-data
